name: transformers-inference
tags: [transformers, flash-attention, inference, release]
description: |
  Transformers inference with different attention implementations

params:
  attn_implementation: [sdpa, flash_attention_2]

job:
  - srun
  - --nodes=1
  - --gpus-per-node=1
  - --ntasks-per-node=1
  - --cpus-per-task=7
  - --time=00:15:00
  - singularity
  - run
  - "{{ extra_args.sif }}"
  - bash -c
  - "{{ snippet.script }}"

snippets:
  - name: script
    content: |
      export HF_HOME=$PWD/data/huggingface

      source .virtualenvs/$(basename $SINGULARITY_NAME .sif)/bin/activate

      cd benchmarks/transformers

      python3 run_benchmarks.py \
          --model-id=LumiOpen/Llama-Poro-2-8B-Base \
          --batch-size=8 \
          --sequence-length=128 \
          --num-tokens-to-generate=128 \
          --config-file=config_${attn_implementation}.json \
          --commit-id=556312c \
          --no-gpu-monitoring

parse: |
  def parse(text, params):
      import re

      metrics = {
          "E2E Latency": "e2e_latency",
          "Time to First Token": "time_to_first_token",
          "Inter-Token Latency": "inter_token_latency",
          "Throughput": "throughput",
      }

      results = {"attn_implementation": params["attn_implementation"]}

      for key, val in metrics.items():
          match = re.search(fr"{key}.+avg=(\d+\.?\d*)([^\s]+)", text)
          if match:
              results[val] = {
                  "unit": match.groups()[1],
                  "value": float(match.groups()[0]),
              }

      return results

validate: |
  def validate(results, params):
      if not results:
          return (False, "no results to validate")

      # <metric>: (<short name in the message>, <min or max>, <limit>, <unit>)
      limits = {
          "e2e_latency": ("e2e", "max", 10.0, "s"),
          "time_to_first_token": ("ttft", "max", 500.0, "ms"),
          "inter_token_latency": ("itl", "max", 50.0, "ms"),
          "throughput": ("throughput", "min", 200.0, "tok/s"),
      }

      # One line per permutation, so that the report's table stays aligned
      all_ok = True
      parts = []
      for metric, (short, kind, limit, unit) in limits.items():
          res = results.get(metric)
          if res is None:
              all_ok = False
              parts.append(f"{short} not parsed")
              continue
          value = res["value"]
          ok = value <= limit if kind == "max" else value >= limit
          all_ok = all_ok and ok
          parts.append(
              f"{short} {round(value, 2):g} {res['unit']} ({'<' if kind == 'max' else '>'} {limit:g})"
              + ("" if ok else " (FAIL)")
          )

      return (all_ok, "; ".join(parts))
